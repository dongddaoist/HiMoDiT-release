[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "himodit"
version = "1.0.0"
description = "Hierarchical Molecular Diffusion Transformer for property-conditioned molecule generation"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = [
    "molecular-generation",
    "discrete-diffusion",
    "cheminformatics",
    "drug-discovery",
    "generative-models",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "rdkit>=2022.09",
    "networkx>=2.8",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
notebooks = ["matplotlib>=3.6", "tqdm>=4.64"]

[project.scripts]
himodit-preprocess = "scripts.preprocess:main"
himodit-train = "scripts.train:main"
himodit-generate = "scripts.generate:main"

[tool.setuptools.packages.find]
include = ["himodit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
